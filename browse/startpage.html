<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>browse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.5rem 1.5rem;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2rem;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #e6edf3;
    margin-bottom: 0.3rem;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #8b949e;
    margin-bottom: 1.5rem;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1.2rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.5s ease;
  }

  .status.idle {
    background: #161b22;
    border: 1px solid #30363d;
    color: #8b949e;
  }

  .status.active {
    background: #0d1117;
    border: 1px solid #00ff88;
    color: #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    transition: all 0.5s ease;
  }

  .idle .dot { background: #484f58; }

  .active .dot {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 8px #00ff88; }
    50% { box-shadow: 0 0 16px #00ffaa; }
  }

  /* History panel */
  .history-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 100%;
    max-width: 900px;
    flex: 1;
    min-height: 0;
    margin-bottom: 1.5rem;
  }

  .history-col {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    max-height: calc(100vh - 280px);
  }

  .history-col.agent { border-top: 2px solid #00ff88; }
  .history-col.human { border-top: 2px solid #58a6ff; }

  .col-header {
    padding: 1rem 1.25rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .agent .col-header { color: #00ff88; }
  .human .col-header { color: #58a6ff; }

  .col-header .col-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .agent .col-dot { background: #00ff88; }
  .human .col-dot { background: #58a6ff; }

  .col-entries {
    flex: 1;
    overflow-y: auto;
    padding: 0 1.25rem 1rem;
  }

  .col-entries::-webkit-scrollbar { width: 4px; }
  .col-entries::-webkit-scrollbar-track { background: transparent; }
  .col-entries::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

  .entry {
    padding: 0.6rem 0;
    border-bottom: 1px solid #21262d;
    animation: fade-in 0.3s ease;
  }

  .entry:last-child { border-bottom: none; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-top {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }

  .entry-ts {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.7rem;
    color: #484f58;
    flex-shrink: 0;
  }

  .entry-title {
    font-size: 0.8rem;
    color: #e6edf3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-url {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.7rem;
    color: #484f58;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 0.15rem;
  }

  .empty-state {
    color: #484f58;
    font-style: italic;
    font-size: 0.8rem;
    padding-top: 2rem;
    text-align: center;
  }

  /* Quick reference — condensed */
  .commands {
    width: 100%;
    max-width: 900px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 0.75rem 1.25rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.5rem;
    align-items: center;
    flex-shrink: 0;
  }

  .commands-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #484f58;
    margin-right: 0.25rem;
  }

  .cmd-item {
    font-size: 0.75rem;
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }

  .cmd-item .cmd {
    font-family: "SF Mono", "Fira Code", monospace;
    color: #c9d1d9;
  }

  .cmd-item .cmd-desc {
    color: #484f58;
    font-size: 0.7rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>browse</h1>
  <p class="subtitle">anti-fingerprint browser for AI agents</p>
  <div class="status idle" id="status">
    <span class="dot"></span>
    <span id="status-text">No agents connected</span>
  </div>
</div>

<div class="history-panel">
  <div class="history-col agent">
    <div class="col-header"><span class="col-dot"></span> Agent History</div>
    <div class="col-entries" id="agent-entries">
      <div class="empty-state" id="agent-empty">No agent activity yet</div>
    </div>
  </div>
  <div class="history-col human">
    <div class="col-header"><span class="col-dot"></span> Human History</div>
    <div class="col-entries" id="human-entries">
      <div class="empty-state" id="human-empty">No browsing yet</div>
    </div>
  </div>
</div>

<div class="commands">
  <span class="commands-label">Quick ref</span>
  <span class="cmd-item"><span class="cmd">browse</span><span class="cmd-desc">launch</span></span>
  <span class="cmd-item"><span class="cmd">browse cookies firefox</span><span class="cmd-desc">import</span></span>
  <span class="cmd-item"><span class="cmd">browse block &lt;domain&gt;</span><span class="cmd-desc">block site</span></span>
  <span class="cmd-item"><span class="cmd">browse block --preset malicious</span><span class="cmd-desc">typosquats</span></span>
  <span class="cmd-item"><span class="cmd">browse blocklist</span><span class="cmd-desc">list</span></span>
</div>

<script>
(function() {
  var STATUS_PORT = location.port ? parseInt(location.port) + 1 : 7332;
  var STATUS_URL = "http://127.0.0.1:" + STATUS_PORT + "/";
  var POLL_MS = 1500;

  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var agentEntries = document.getElementById("agent-entries");
  var humanEntries = document.getElementById("human-entries");
  var agentEmpty = document.getElementById("agent-empty");
  var humanEmpty = document.getElementById("human-empty");

  var knownCount = 0;  // how many history entries we've already rendered

  function truncate(str, max) {
    if (!str) return "";
    return str.length > max ? str.substring(0, max) + "\u2026" : str;
  }

  function renderEntry(item) {
    var div = document.createElement("div");
    div.className = "entry";
    div.innerHTML =
      '<div class="entry-top">' +
        '<span class="entry-ts">' + item.ts + '</span>' +
        '<span class="entry-title">' + truncate(item.title || item.url, 50) + '</span>' +
      '</div>' +
      '<div class="entry-url">' + truncate(item.url, 70) + '</div>';
    return div;
  }

  async function poll() {
    try {
      var resp = await fetch(STATUS_URL);
      var data = await resp.json();
      var count = data.agents || 0;
      var history = data.history || [];

      // Update status pill
      if (count > 0) {
        statusEl.className = "status active";
        statusText.textContent = count + " agent" + (count > 1 ? "s" : "") + " connected";
      } else {
        statusEl.className = "status idle";
        statusText.textContent = "No agents connected";
      }

      // Render new entries only
      if (history.length > knownCount) {
        for (var i = knownCount; i < history.length; i++) {
          var item = history[i];
          var el = renderEntry(item);
          if (item.source === "agent") {
            if (agentEmpty) { agentEmpty.remove(); agentEmpty = null; }
            agentEntries.insertBefore(el, agentEntries.firstChild);
          } else {
            if (humanEmpty) { humanEmpty.remove(); humanEmpty = null; }
            humanEntries.insertBefore(el, humanEntries.firstChild);
          }
        }
        knownCount = history.length;
      }
    } catch (e) {
      statusEl.className = "status idle";
      statusText.textContent = "Status unavailable";
    }
  }

  setInterval(poll, POLL_MS);
  poll();
})();
</script>

</body>
</html>
